name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not keep the token around for later steps such as npm ci lifecycle scripts.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # No `npm run test:e2e` here. The Playwright smoke test needs a licensed
      # Foundry v14 server in Docker, with credentials in secrets/foundry.json.
      # CI has neither, so run the smoke test locally before a push.
